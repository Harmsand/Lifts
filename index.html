/* Apply a path overlay to a workout's exercise list. */
function applyPath(w, pathId) {
  const P = PATHS[pathId] || PATHS.hybrid;
  const nonBonus = w.ex.filter(e => !e.bonus);
  const nonBonusCount = nonBonus.length;
  let demoted = 0;
  return {
    ...w,
    ex: w.ex.map(e => {
      const out = {
        ...e
      };
      if (e.anchor) {
        out.s = P.anchor.sets;
        out.r = P.anchor.reps;
      } else if (e.hold) {
        // holds keep their own prescription
      } else if (e.paired) {
        out.s = P.accessory.sets;
        out.r = P.accessory.reps;
      } else if (!e.bonus) {
        // secondary compounds are the non-paired, non-anchor main-block lifts
        const isSecondary = nonBonus.indexOf(e) <= 2;
        if (isSecondary) {
          out.s = P.secondary.sets;
          out.r = P.secondary.reps;
        } else {
          out.s = P.accessory.sets;
          out.r = P.accessory.reps;
        }
      } else {
        out.s = P.accessory.sets;
        out.r = P.accessory.reps;
      }
      // strength path trims the tail of the main block into bonus
      if (P.demoteAccessories > 0 && !e.anchor && !e.paired && !e.bonus) {
        const idx = nonBonus.indexOf(e);
        if (idx >= nonBonusCount - P.demoteAccessories) {
          out.bonus = true;
          demoted++;
        }
      }
      // hypertrophy path promotes one bonus item into the main block
      if (P.demoteAccessories < 0 && e.bonus && !e.hold) {
        const bonusList = w.ex.filter(x => x.bonus && !x.hold);
        if (bonusList.indexOf(e) === 0) out.bonus = false;
      }
      return out;
    })
  };
}

const PLAN_INTRO = {
  title: "About this plan",
  lead: "This is a four day program built to make you stronger and more muscular at the same time, without forcing a choice between the two. Every session is anchored by one heavy compound lift, the movements that drive most of your progress: bench, squat, overhead press, and deadlift. Everything else in the day supports that anchor rather than competing with it.\n\nIt runs as a rolling rotation instead of a fixed weekly schedule. You do the next workout whenever you train, so a missed day doesn't break the plan and an inconsistent week still moves you forward.",
  blocks: [{
    t: "Balanced by design",
    d: "Push is matched with pull, upper with lower, and the front of the body with the back. Most programs drift toward the muscles you can see in the mirror, which is how people end up with cranky shoulders and an aching low back. Here the rows match the presses, the hinges match the squats, and the posterior chain gets equal billing with the quads and chest."
  }, {
    t: "Built on the kinetic chain",
    d: "Strength is a system, not a collection of parts. Your glutes, core, and hips are the link between your upper and lower body, and when they don't do their job something else compensates, usually your low back. That's why glute activation, anti extension core work, and hip mobility sit alongside the barbell lifts rather than being treated as optional extras. Activating the right muscles before you load them is what lets the big lifts get heavy safely."
  }],
  goals: [{

    t: "Looking better",

    t: "Moving better",

    t: "Longevity",

function makeScene(bgId) {

    const stars = Array.from({

      x: Math.random() * 1080,
      y: Math.random() * 380,
      r: Math.random() < 0.7 ? 1 : 2,
      phase: Math.random() * Math.PI * 2
    }));
    const buildings = [];

    while (x < 1080) {
      const w = 70 + Math.random() * 80,
        h = 36 + Math.random() * 56;
      buildings.push({
        x,
        w,
        h
      });
      x += w + 4 + Math.random() * 10;
    }
    return {
      stars,
      buildings
    };
  }
  if (bgId === "mountains") {
    const ridge = (baseY, amp) => {
      const pts = [];
      let x = 0;
      while (x <= 1080) {
        x += 70 + Math.random() * 70;
        pts.push([Math.min(x, 1080), baseY - Math.random() * amp]);
      }
      return pts;
    };
    return {
      ridgeFar: ridge(724 - 70, 100),
      ridgeNear: ridge(724 - 30, 150)
    };
  }
  if (bgId === "starfield") {
    const stars = Array.from({
      length: 130
    }, () => ({
      x: Math.random() * 1080,
      y: Math.random() * 615,
      r: [1, 1, 1, 1, 2, 2, 3][Math.floor(Math.random() * 7)],
      phase: Math.random() * Math.PI * 2,
      cyan: Math.random() < 0.3
    }));
    return {
      stars
    };
  }
  return {};
}

  ctx.fillText(Math.round(totalVol).toLocaleString() + " lb", 78, size - 198);
  ctx.restore();

    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(" + TH.grid + ",0.30)";
    ctx.fillRect(78, size - 172, size - 156, 1);
    ctx.font = "italic 26px -apple-system, Arial";
    ctx.fillStyle = "#CBB8EA";
    // wrap the quote to at most two lines
    const maxW = size - 156;
    const words = ('"' + q.t + '"').split(" ");
    const lines = [];
    let line = "";
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = words[i];
      } else line = test;
      if (lines.length === 2) break;
    }
    if (lines.length < 2 && line) lines.push(line);
    if (lines.length === 2 && ctx.measureText(lines[1]).width > maxW - 40) {
      while (ctx.measureText(lines[1] + "…").width > maxW && lines[1].length > 8) lines[1] = lines[1].slice(0, -1);
      lines[1] += "…";
    }
    lines.forEach((ln, i) => ctx.fillText(ln, 78, size - 138 + i * 32));
    ctx.font = "bold 22px -apple-system, Arial";
    ctx.fillStyle = TH.lifts;
    ctx.fillText("— " + q.a, 78, size - 138 + lines.length * 32 + 8);

/* strength standards: bodyweight-multiple thresholds, men (community reference, e.g. Strength Level style) */
const STANDARDS_RATIOS = {
  "Barbell bench press": [0.5, 0.75, 1.0, 1.5, 2.0],
  "Barbell back squat": [0.75, 1.0, 1.5, 2.0, 2.5],
  "Conventional deadlift": [1.0, 1.5, 2.0, 2.5, 3.0],
  "Barbell overhead press": [0.35, 0.55, 0.8, 1.1, 1.3]
};
/* Female bodyweight-multiple standards. Women are typically closest to men on
   lower-body pulling and furthest on upper-body pressing, which these reflect. */
const STANDARDS_RATIOS_F = {
  "Barbell bench press": [0.25, 0.4, 0.6, 0.9, 1.2],
  "Barbell back squat": [0.5, 0.75, 1.1, 1.5, 1.9],
  "Conventional deadlift": [0.6, 0.95, 1.35, 1.8, 2.3],
  "Barbell overhead press": [0.2, 0.32, 0.47, 0.65, 0.8]
};
const STANDARDS_LABELS = ["Beginner", "Novice", "Intermediate", "Advanced", "Elite"];
const STANDARDS_COLORS = ["#A98FD6", "#6FF0E6", "#39F2E4", "#FF7ACF", "#FFC98A"];
/* Rough age allowance: no change under 40, then about 1% per year, capped.
   Deliberately approximate. Published standards are aggregated across adult
   ages and don't provide reliable age bands, so this is a rule of thumb. */
function ageFactor(age) {
  const a = parseFloat(age);
  if (!a || a <= 40) return 1;
  return Math.max(0.65, 1 - (a - 40) * 0.01);
}

/* Read the user's saved profile (bodyweight / sex / age) from local settings. */
function readProfile() {
  let bw = 210,
    sex = "m",
    age = 39;
  try {
    bw = parseFloat(localStorage.getItem("hf_bw")) || 210;
    sex = localStorage.getItem("hf_sex") || "m";
    age = parseFloat(localStorage.getItem("hf_age")) || 39;
  } catch (e) {}
  return {
    bw,
    sex,
    age
  };
}

/* Tier index (0 Beginner .. 4 Elite) for a lift, or -1 if untiered/no data.
   Shared by Strength Standards and the adaptive rest timer so they never disagree. */
function tierIndexFor(logs, wid, name) {
  const table = STANDARDS_RATIOS[name] ? true : false;
  if (!table) return -1;
  const {
    bw,
    sex,
    age
  } = readProfile();
  if (!bw) return -1;
  const e1 = bestEst1RM(logs, wid, name);
  if (!e1) return -1;
  const base = sex === "f" ? STANDARDS_RATIOS_F : STANDARDS_RATIOS;
  const ratios = base[name].map(r => r * ageFactor(age));
  const ratio = e1 / bw;
  let idx = -1;
  for (let i = ratios.length - 1; i >= 0; i--) {
    if (ratio >= ratios[i]) {
      idx = i;
      break;
    }
  }
  return idx;
}

/* Rest between sets scales with strength: the heavier the load relative to
   your own capacity, the more recovery each set needs.
   Tier index: -1/0 Beginner, 1 Novice, 2 Intermediate, 3 Advanced, 4 Elite. */
const REST_BY_TIER = [{
  label: "2–3 min",
  note: "beginner range"
}, {
  label: "3–4 min",
  note: "novice range"
}, {
  label: "4–6 min",
  note: "intermediate range"
}, {
  label: "6–8 min",

/* Build the daily briefing: what today's session is, and how it compares

function buildBriefing(logs, wid) {
  const W = WORKOUTS.find(x => x.id === wid);
  if (!W) return null;
  const anchors = W.ex.filter(e => e.anchor);

  // find the most recent date this workout was logged
  let lastDay = null;
  W.ex.forEach(e => {
    (logs[exKey(wid, e.n)] || []).forEach(s => {
      const d = localDay(s.date);
      if (d && (!lastDay || d > lastDay)) lastDay = d;
    });
  });
  const lines = [];
  anchors.forEach(e => {
    const hist = logs[exKey(wid, e.n)] || [];
    if (!hist.length) {
      lines.push({
        n: e.n,
        txt: "first time logging this",
        up: null

      return;
    }
    const lastSession = hist[hist.length - 1];
    const lastBest = bestSet(lastSession.sets);
    const allBest = allTimeBest(logs, wid, e.n, e.hold);
    if (!lastBest) {

    const isBestEver = allBest && metricFor(lastBest, e.hold) >= metricFor(allBest, e.hold);
    lines.push({
      n: e.n,

      up: isBestEver

  if (lastDay) {
    const days = Math.round((Date.now() - new Date(lastDay + "T12:00:00").getTime()) / 86400000);

function restForAnchor(logs, wid, name) {
  const idx = tierIndexFor(logs, wid, name);
  if (idx < 0) return null;
  const r = REST_BY_TIER[Math.max(0, Math.min(4, idx))];
  return {
    ...r,
    tier: STANDARDS_LABELS[Math.max(0, idx)]

/* ---------------- helpers ---------------- */
const parseSetCount = s => typeof s === "number" ? s : parseInt(String(s), 10) || 1;

  let best = null;
  (sets || []).forEach(x => {
    const w = parseFloat(x.w),
      r = parseFloat(x.r);
    if (isNaN(w) || isNaN(r)) return;
    if (!best || w > best.w || w === best.w && r > best.r) best = {
      w,
      r
    };
  });
  return best;
};
const labelToId = lbl => (WORKOUTS.find(w => w.label === lbl) || {}).id;
const fmtSet = (x, hold) => {
  if (!x) return "–";
  if (hold) return (x.r || "–") + "s";
  const w = parseFloat(x.w);
  if (!x.w || w === 0) return "BW × " + (x.r || "–");
  return x.w + " × " + (x.r || "–");
};
const exHold = (wid, name) => {

};
const metricFor = (set, hold) => hold ? parseFloat(set.r) || 0 : (parseFloat(set.w) || 0) * (1 + (parseFloat(set.r) || 0) / 30);
const allTimeBest = (logs, wid, name, hold) => {
  const hist = logs[exKey(wid, name)] || [];
  let best = null,
    bestMetric = -1;
  hist.forEach(s => {

/* ---------------- XP & levelling ----------------

const XP_SESSION = 100,
  XP_PR = 75,
  XP_MOBILITY = 50,
  XP_CONSISTENCY = 50;
const XP_PR_CAP = 3,
  XP_DAILY_CAP = 400;
function xpVolumeAward(sessionVol, baselineVol) {
  if (!baselineVol) return 75; // no history yet, neutral award
  const r = sessionVol / baselineVol;
  if (r < 0.80) return 0;
  if (r < 1.00) return 50;
  if (r < 1.10) return 75;
  return 100;
}
function sessionVolumeOf(sets, hold) {

      r = parseFloat(x.r);

    v += (isNaN(wv) || wv === 0 ? 1 : wv) * r; // bodyweight counts reps
  });

/* XP earned by one specific session, itemised. Computed by diffing the total
   before and after that session exists, so it can never drift from the

/* Rule-based post-session commentary. No AI, no network call: every line

   whatever note the user typed. Deterministic and free to run offline. */
function repsBelowTarget(rows, targetStr) {
  if (!targetStr) return false;
  const m = String(targetStr).match(/(\d+)\D+(\d+)/);
  if (!m) return false;
  const lo = parseFloat(m[1]);
  const shortfalls = rows.filter(x => {
    const r = parseFloat(x.r);
    return !isNaN(r) && r < lo;
  });

function exerciseCommentary(exDef, rows, priorBest, allBest, note, hold, rating) {
  const lines = [];
  const today = bestSet(rows);
  const effort = rating && rating.effort; // "hard" | "normal" | "strong"
  const pain = rating && rating.pain; // "discomfort" | null

  if (pain === "discomfort") {
    lines.push({
      t: "You flagged discomfort on this one. Consider dropping the weight or swapping the exercise next time, and don't push through anything sharp.",
      tone: "warn"
    });
  }
  if (today && priorBest) {
    const beat = metricFor(today, hold) > metricFor(priorBest, hold);
    const same = Math.abs(metricFor(today, hold) - metricFor(priorBest, hold)) < 0.01;
    if (allBest && metricFor(today, hold) >= metricFor(allBest, hold) && metricFor(today, hold) > metricFor(priorBest, hold)) {
      lines.push({
        t: "New high on this lift.",
        tone: "good"
      });
    } else if (beat) {
      lines.push({
        t: "Improved on last time.",
        tone: "good"
      });
    } else if (same) {
      lines.push({
        t: "Matched last session, no change.",
        tone: "neutral"
      });
    } else {
      const tracks = effort === "hard" || pain === "discomfort";
      lines.push({
        t: "Below your last session" + (tracks ? ", which tracks with how you rated it" : "") + ".",
        tone: "warn"
      });
    }
  } else if (today && !priorBest) {
    lines.push({
      t: "First time logging numbers on this one.",
      tone: "neutral"
    });
  }
  if (exDef && exDef.r && repsBelowTarget(rows, exDef.r) && !hold) {
    lines.push({
      t: "Reps came in under the " + exDef.r + " target on most sets. Worth trying a touch lighter next time so you land in range.",
      tone: "warn"
    });
  }
  if (effort === "strong" && pain !== "discomfort") {
    lines.push({
      t: "You rated this one strong. If the weight moved fast, next session may be a good one to add a little load.",
      tone: "good"
    });

}
function buildSessionCommentary(w, draftByKey, notesByKey, logsBefore, ratingsByKey) {
  const out = [];
  w.ex.forEach(e => {
    const k = exKey(w.id, e.n);
    const rows = (draftByKey[k] || []).filter(x => x.w !== "" || x.r !== "");
    if (!rows.length) return;
    const note = (notesByKey[k] || "").trim();
    const rating = ratingsByKey && ratingsByKey[k] || null;
    const priorBest = allTimeBest(logsBefore, w.id, e.n, e.hold);
    const allBest = priorBest; // logsBefore already excludes today, so this doubles as all-time-before-today
    const lines = exerciseCommentary(e, rows, priorBest, allBest, note, e.hold, rating);
    if (lines.length || note) out.push({
      name: e.n,
      note,
      lines

}
function sessionXPBreakdown(logsAfter, wid, day) {
  // rebuild a copy of the log with this day's entries for this workout removed
  const logsBefore = {};
  Object.keys(logsAfter).forEach(k => {
    if (k.split("::")[0] !== wid) {
      logsBefore[k] = logsAfter[k];
      return;
    }
    logsBefore[k] = (logsAfter[k] || []).filter(s => localDay(s.date) !== day);
  });
  const after = computeXP(logsAfter),
    before = computeXP(logsBefore);
  const d = key => after.breakdown[key] - before.breakdown[key];
  const items = [];
  const sessionXP = d("sessionXP");
  const volumeXP = d("volumeXP");
  const prXP = d("prXP");
  const prCount = d("prCount");
  const consistencyXP = d("consistencyXP");
  if (sessionXP) items.push({
    label: "Session logged",
    xp: sessionXP
  });
  if (volumeXP) items.push({
    label: "Volume vs your 30 day average",
    xp: volumeXP

    label: prCount + " personal record" + (prCount === 1 ? "" : "s"),
    xp: prXP,
    hot: true

    label: "3 sessions this week",

function computeXP(logs) {

  Object.keys(logs).forEach(k => {
    const wid = k.split("::")[0];
    const name = k.slice(wid.length + 2);
    const hold = exHold(wid, name);
    (logs[k] || []).forEach(s => {
      const day = localDay(s.date);
      if (!day) return;
      const id = day + "|" + wid;
      if (!byDayWid[id]) byDayWid[id] = {
        day,
        wid,
        vol: 0,
        exercises: []
      };
      byDayWid[id].vol += sessionVolumeOf(s.sets, hold);
      byDayWid[id].exercises.push({

        hold,
        sets: s.sets,
        date: s.date

    volumeXP: 0,
    prXP: 0,
    prCount: 0,
    consistencyXP: 0,
    weeks: 0

  sessions.forEach((sess, idx) => {
    let dayXP = 0;

    // volume vs this workout's own rolling 30-day mean, excluding today

    const baseline = prior.length ? prior.reduce((a, o) => a + o.vol, 0) / prior.length : 0;

      if (prs >= XP_PR_CAP) return;
      const key = exKey(sess.wid, ex.name);
      const hist = logs[key] || [];
      const before = hist.filter(h => localDay(h.date) < sess.day);
      if (!before.length) return; // first-ever log isn't a PR
      let priorBest = null;
      before.forEach(h => {
        const b = bestSet(h.sets);
        if (b && (!priorBest || metricFor(b, ex.hold) > metricFor(priorBest, ex.hold))) priorBest = b;
      });
      const todayBest = bestSet(ex.sets);
      if (priorBest && todayBest && metricFor(todayBest, ex.hold) > metricFor(priorBest, ex.hold)) prs++;

    cum += need;
    lvl++;
    if (lvl > 200) break;
  }
  const need = xpToReachLevel(lvl);

    level: lvl,

/* Local calendar date (YYYY-MM-DD) for a stored timestamp.
   Using UTC here would put an evening session on the following day for
   anyone west of Greenwich, which made the calendar and the history

  if (!dateish) return "";

  if (isNaN(d)) return String(dateish).slice(0, 10);

  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());

/* "What's next" is derived from the log itself, not tracked as separate state.

    const wid = k.split("::")[0];
    if (wid === "BON") return; // bonus days don't advance the rotation
    (logs[k] || []).forEach(s => {
      const t = new Date(s.date).getTime();
      if (!isNaN(t) && t > latestTime) {
        latestTime = t;
        latestWid = wid;
      }
    });

    const exName = k.slice(wid.length + 2);

      wid,
      exName,
      date: s.date,
      day: localDay(s.date),
      sets: s.sets

      const w = parseFloat(x.w),
        r = parseFloat(x.r);
      if (!isNaN(w) && !isNaN(r) && w > 0) {
        const e1 = w * (1 + r / 30);
        if (e1 > best) best = e1;
